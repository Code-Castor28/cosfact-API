[mypy]
# Rutas de módulos locales
mypy_path = apps

# Plugin oficial de django-stubs para resolver modelos, managers, FKs, etc.
plugins = mypy_django_plugin.main


# Django settings necesario para que django-stubs funcione
[mypy.plugins.django-stubs]
django_settings_module = "core.settings.development"

# DRF stubs
[mypy-rest_framework.*]
ignore_missing_imports = True

# Librerías sin stubs — ignorar
[mypy-celery.*]
ignore_missing_imports = True

[mypy-dateutil.*]
ignore_missing_imports = True

[mypy-django_rest_passwordreset.*]
ignore_missing_imports = True

[mypy-environ.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

# Silenciar advertencias de argumentos en CheckConstraint dentro de models
[mypy-*.models]
ignore_errors = True

[mypy-*.django.*]
ignore_errors = True