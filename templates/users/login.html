<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DerejFact — Acceso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0d0f14;
            --surface: #151820;
            --border: #252a3a;
            --accent: #3d7fff;
            --red: #e74c3c;
            --text: #e8eaf0;
            --text-dim: #7a8099;
            --mono: 'IBM Plex Mono', monospace;
            --sans: 'IBM Plex Sans', sans-serif;
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrap {
            width: 100%;
            max-width: 380px;
            padding: 20px;
        }

        .brand {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-name {
            font-family: var(--mono);
            font-size: 24px;
            color: var(--accent);
            letter-spacing: -1px;
        }

        .brand-sub {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 24px;
            color: var(--text-dim);
            font-family: var(--mono);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 6px;
            font-family: var(--mono);
        }

        input {
            width: 100%;
            padding: 11px 14px;
            background: #0d0f14;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
            font-family: var(--sans);
            outline: none;
            transition: border-color 0.15s;
        }

        input:focus { border-color: var(--accent); }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            font-family: var(--sans);
            transition: background 0.15s;
        }

        .btn-submit:hover { background: #2d6fe8; }

        .alert {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            background: rgba(231,76,60,0.1);
            border: 1px solid rgba(231,76,60,0.3);
            color: var(--red);
        }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="brand">
        <div class="brand-name">DerejFact</div>
        <div class="brand-sub">API Facturación Electrónica · DGII</div>
    </div>

    <div class="card">
        <div class="card-title">Acceso al sistema</div>

        {% for message in messages %}
            <div class="alert">{{ message }}</div>
        {% endfor %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Correo electrónico</label>
                <input type="email" name="email" autofocus autocomplete="email"
                       value="{{ form.email.value|default:'' }}">
                {% if form.email.errors %}
                    <div style="color:#e74c3c;font-size:12px;margin-top:4px;">{{ form.email.errors.0 }}</div>
                {% endif %}
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" autocomplete="current-password">
                {% if form.password.errors %}
                    <div style="color:#e74c3c;font-size:12px;margin-top:4px;">{{ form.password.errors.0 }}</div>
                {% endif %}
            </div>
            <button type="submit" class="btn-submit">Entrar</button>
        </form>
    </div>
</div>
</body>
</html>
